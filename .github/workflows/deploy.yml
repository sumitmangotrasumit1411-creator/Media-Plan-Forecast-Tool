name: CI / CD — Media Plan Forecast Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ──────────────────────────────────────────────────────────────────────────────
# Environment variables available to all jobs
# ──────────────────────────────────────────────────────────────────────────────
env:
  IMAGE_NAME: media-plan-engine
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. Lint & syntax check ───────────────────────────────────────────────────
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install pyflakes

      - name: Pyflakes syntax check
        run: |
          python -m pyflakes app.py parser.py metrics.py insights.py \
            trends.py forecast.py exporter.py \
            config/settings.py services/file_service.py \
            services/processing_service.py utils/formatters.py \
            components/charts.py

  # ── 2. Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests directory yet — skipping"

      - name: Import smoke test
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from config.settings import settings
          from utils.formatters import fmt_currency, fmt_pct, fmt_num
          from services.file_service import validate_uploaded_file
          import pandas as pd
          from forecast import run_forecast, monthly_forecast, auto_channel_split, rebalance_channel_split
          r = run_forecast(500000, 50000, 200000, 10.0)
          assert r['target_revenue'] > 500000

          # Auto channel split: one SP input drives the remaining budget
          # proportionally into SB/SD and always totals 100%.
          split_default = auto_channel_split(65)
          assert round(sum(split_default.values()), 10) == 1.0
          assert split_default['Sponsored Products'] > split_default['Sponsored Brands'] > split_default['Sponsored Display']

          # Any slider can be changed; the other two rebalance and the
          # resulting mix remains exactly 100% with SP > SB > SD.
          base_split = {'Sponsored Products': 0.65, 'Sponsored Brands': 0.25, 'Sponsored Display': 0.10}
          for changed, value in [
              ('Sponsored Products', 55),
              ('Sponsored Brands', 30),
              ('Sponsored Display', 15),
          ]:
              changed_mix = rebalance_channel_split(changed, value, base_split)
              assert round(sum(changed_mix.values()), 10) == 1.0
              assert changed_mix['Sponsored Products'] > changed_mix['Sponsored Brands'] > changed_mix['Sponsored Display']

          split_low_sp = auto_channel_split(35)
          assert round(sum(split_low_sp.values()), 10) == 1.0
          assert split_low_sp['Sponsored Products'] > split_low_sp['Sponsored Brands'] > split_low_sp['Sponsored Display']

          channel_df = pd.DataFrame({
              'ad_product': ['Sponsored Products', 'Sponsored Brands', 'Sponsored Display'],
              'spend': [35000, 10000, 5000],
              'ad_sales': [175000, 35000, 10000],
          })
          mix_a = run_forecast(
              500000, 50000, 200000, 10.0,
              custom_channel_split=split_default,
              channel_perf_df=channel_df,
          )
          mix_b = run_forecast(
              500000, 50000, 200000, 10.0,
              custom_channel_split=auto_channel_split(40),
              channel_perf_df=channel_df,
          )
          assert mix_a['target_ad_sales'] == mix_b['target_ad_sales'], 'Channel mix should not change the revenue-driven ad-sales target'
          assert mix_a['recommended_spend'] != mix_b['recommended_spend'], 'Channel split must change projected spend'

          # Even when ad sales are pinned, changing channel mix must change
          # the derived spend unless spend/ROAS/TACOS is also explicitly pinned.
          pinned_sales_a = run_forecast(
              500000, 50000, 200000, 0,
              custom_channel_split=split_default,
              channel_perf_df=channel_df,
              override_ad_sales=240000,
          )
          pinned_sales_b = run_forecast(
              500000, 50000, 200000, 0,
              custom_channel_split=auto_channel_split(40),
              channel_perf_df=channel_df,
              override_ad_sales=240000,
          )
          assert pinned_sales_a['recommended_spend'] != pinned_sales_b['recommended_spend'], 'Channel mix must affect derived spend when sales are pinned'

          # Monthly plan must reconcile to the selected annual forecast,
          # rather than remaining tied to the original monthly actuals.
          trend = pd.DataFrame({
              '_period_dt': pd.to_datetime(['2025-01-01', '2025-02-01', '2025-03-01']),
              'spend': [10000, 20000, 30000],
              'ad_sales': [40000, 80000, 120000],
              'impressions': [1000, 2000, 3000],
              'clicks': [100, 200, 300],
              'ad_orders': [10, 20, 30],
          })
          month_a, _ = monthly_forecast(
              trend, 10, 500000, split_default,
              annual_spend_override=120000, annual_sales_override=480000,
          )
          month_b, _ = monthly_forecast(
              trend, 10, 500000, split_default,
              annual_spend_override=240000, annual_sales_override=720000,
          )
          assert round(month_a['Projected Spend ($)'].sum(), 2) == 120000
          assert round(month_a['Projected Ad Sales ($)'].sum(), 2) == 480000
          assert round(month_b['Projected Spend ($)'].sum(), 2) == 240000
          assert round(month_b['Projected Ad Sales ($)'].sum(), 2) == 720000
          assert month_a['Projected Spend ($)'].tolist() != month_b['Projected Spend ($)'].tolist()

          custom = run_forecast(500000, 50000, 200000, 10.0, override_target_revenue=750000)
          assert custom['target_revenue'] == 750000
          assert custom['recommended_spend'] != r['recommended_spend'], 'Custom target must change forecast'
          print('✓ All imports and interactive forecast smoke tests passed')
          "

  # ── 3. Docker build (on push to main only) ───────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — validates Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 4. Deploy to Render (optional — requires RENDER_DEPLOY_HOOK secret) ──────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET == 'render'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" || true

  # ── 5. Deploy to Fly.io (optional — requires FLY_API_TOKEN secret) ───────────
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET == 'fly'
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
